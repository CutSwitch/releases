name: Release dispatcher checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_TERMINAL_PROMPT: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test private-workflow dispatch without network or signing
        run: python3 -B -m unittest test_dispatcher.py -v
